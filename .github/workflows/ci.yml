name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (CPU backend)
        run: >
          cargo clippy -p rlgymppo -p rlgymppo-model --no-default-features
          --features flex --all-targets -- -D warnings
      # Environment tests need RocketSim collision meshes, which are not
      # redistributable, so CI runs the learner and model tests only.
      - name: Tests (CPU backend)
        run: >
          cargo test -p rlgymppo -p rlgymppo-model --no-default-features --features flex --
          --skip environment::batch_sim::phase3_tests
          --skip environment::pool_collector
